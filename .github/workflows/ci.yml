name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install free-threaded Python and package
        run: |
          uv python install 3.15t
          uv venv --python 3.15t
          uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Type check
        run: .venv/bin/pyright

      - name: Run tests
        run: .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install free-threaded Python and build tools
        run: |
          uv python install 3.15t
          uv venv --python 3.15t
          uv pip install "build>=1.6.1" "twine>=7.0.0" --python .venv/bin/python

      - name: Build wheel and sdist
        run: .venv/bin/python -m build

      - name: Validate distributions
        run: .venv/bin/python -m twine check dist/*
