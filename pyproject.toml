[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-gym"
version = "1.1.0"
description = "Reset-free Gymnasium rollouts with parallel stepping and episode metrics"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
]

[project.urls]
Homepage = "https://github.com/micahr234/mouse-gym"
Repository = "https://github.com/micahr234/mouse-gym"
Issues = "https://github.com/micahr234/mouse-gym/issues"

[project.optional-dependencies]
examples = [
    "mouse-gym",
    "gymnasium[classic-control]>=1.3.0",
    "matplotlib>=3.11.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "repeat-task-gym @ git+https://github.com/micahr234/repeat-task-gym.git",
    "procedural-frozenlake @ git+https://github.com/micahr234/procedural-frozenlake.git",
]
all = [
    "mouse-gym[examples]",
]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "build>=1.6.1",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
mouse_gym = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.setuptools]
packages = [
    "mouse_gym",
]

[tool.setuptools.package-dir]
"" = "src"
